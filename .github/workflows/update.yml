name: IPOデータを毎日更新

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なものを入れる
        run: pip install -r scripts/requirements.txt

      - name: AIで調べて、チェックして、data.json を更新する
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_data.py

      - name: 変更があれば保存する
        run: |
          if ! git diff --quiet data.json; then
            git config user.name "ipo-update-bot"
            git config user.email "ipo-update-bot@users.noreply.github.com"
            git add data.json
            git commit -m "IPOデータを自動更新"
            git push
          else
            echo "変更はありませんでした"
          fi
